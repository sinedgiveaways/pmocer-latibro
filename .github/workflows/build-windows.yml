# orbitals-recomp.exe for Windows, built on every push and pull request to orbitals-port (or by hand) so it can be downloaded from the
# run's Artifacts and tried on a Windows machine. Same build as port_windows.yml: the Windows executable is
# cross-compiled from Linux with llvm-mingw and Ninja (tools/build/build.py --target windows), not with MSVC or CMake.
# Nothing of any game goes in. The icon's source picture is not in the repository: it is fetched here, checked by
# sha256, and turned into an .ico by tools/build/make_ico.py (docs/branding.md).
name: Build Windows

on:
  push:
    branches: [orbitals-port, mco2vie/orbital-crash-trace]
  pull_request:
    branches: [orbitals-port, copilot/orbital-copilot-analyse]
  workflow_dispatch:

permissions:
  contents: read

env:
  ICON_URL: https://cdn2.steamgriddb.com/thumb/1973ddb8a87e4da50befa772a5a1474d.png
  ICON_SHA256: daefe63212606dc82a4ad0412883d1a2c95e549de8cb9bd8009719908001e13a

jobs:
  windows:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git ccache ninja cmake binutils uv python curl
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: ccache in the checkout, kept between runs (build.py compiles through it when installed)
        run: echo "CCACHE_DIR=$PWD/.ccache" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ github.job }}-${{ github.sha }}
          restore-keys: ccache-${{ github.job }}-
      - name: Git trusts the checkout (build.py's version comes from git describe)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache@v4
        with:
          path: build/win
          key: windeps-${{ hashFiles('tools/build/windeps.py') }}
      - uses: actions/cache@v4   # the setup's downloads (checked by sha256) and zig's build of the Windows C runtime
        with:
          path: build/dist/dl
          key: dist-dl-windows-${{ hashFiles('tools/build/dist.py') }}
      - name: Icon
        run: |
          mkdir -p assets/icon
          curl -fsSL "$ICON_URL" -o assets/icon/orbitals_logo.png
          echo "$ICON_SHA256  assets/icon/orbitals_logo.png" | sha256sum -c -
          uv run tools/build/make_ico.py
      - name: llvm-mingw and the Windows libraries
        run: uv run tools/build/windeps.py
      - name: The executable
        run: uv run tools/build/build.py --target windows --dist --runtime-only
      - name: Setup tools
        run: uv run tools/build/dist.py --target windows
      - name: Steam's steam_api64.dll for Remote Play Together (pinned sha256, docs/remote-play.md)
        run: uv run tools/build/steamlib.py --target windows
      - name: Zip
        run: uv run tools/build/release.py --target windows --version "0.2.0-${GITHUB_SHA::7}-mco2vie"
      - name: orbitals-recomp.exe out of the zip
        run: |
          mkdir -p build/exe
          python - <<'EOF'
          import glob, zipfile
          z = zipfile.ZipFile(glob.glob("build/release/*windows-x64.zip")[0])
          name = next(n for n in z.namelist() if n.endswith("/orbitals-recomp.exe"))
          print("steam_api64.dll in the zip:", any(n.endswith("/steam_api64.dll") for n in z.namelist()))
          open("build/exe/orbitals-recomp.exe", "wb").write(z.read(name))
          print("extracted", name)
          EOF
      - name: Old names in the executable (fails the build) and in the package (report)
        run: |
          python tools/build/check_names.py build/exe/orbitals-recomp.exe --strict --limit 20
          python tools/build/check_names.py build/dist/windows
          python - <<'EOF'
          # each old name, counted in UTF-8 and UTF-16LE; then the version resource, as UTF-16 text
          import re
          d = open("build/exe/orbitals-recomp.exe", "rb").read()
          for name in ("MKW_", "Mario Kart", "MarioKart", "mkw-recomp", "adriadam10", "ORBITALS_"):
              n8 = len(re.findall(re.escape(name.encode()), d, re.I))
              n16 = len(re.findall(re.escape(name.encode("utf-16le")), d, re.I))
              print(f"count {name!r}: {n8} UTF-8, {n16} UTF-16")
              if name != "ORBITALS_":
                  for m in list(re.finditer(re.escape(name.encode()), d, re.I))[:8]:
                      ctx = d[max(0, m.start() - 40) : m.end() + 40]
                      print(f"    at {m.start():#x}: {ctx.decode('latin-1')!r}")
          n = len(re.findall(rb"(?<![A-Za-z])mkw(?![A-Za-z])", d, re.I))
          print(f"count 'mkw' as a word: {n}")
          for key in ("FileDescription", "ProductName", "OriginalFilename", "ProductVersion"):
              i = d.find(key.encode("utf-16le"))
              tail = d[i + 2 * len(key) : i + 2 * len(key) + 120].decode("utf-16le", "replace") if i >= 0 else None
              print(key, "->", tail.lstrip("\x00").split("\x00")[0] if tail is not None else "NOT FOUND")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: orbitals-recomp-exe-mco2vie
          path: build/exe/orbitals-recomp.exe
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: orbitals-recomp-windows-x64-mco2vie
          path: build/release/*.zip
          retention-days: 14
